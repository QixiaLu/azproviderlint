---
name: govulncheck
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - '.github/workflows/govulncheck.yaml'
  schedule:
    - cron: '17 4 * * 1' # weekly, so new CVEs against unchanged code still get flagged

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          # go-version-input defaults to 'stable', which overrides go-version-file entirely —
          # blank it so the pinned .go-version is what actually gets scanned
          go-version-input: ''
          go-version-file: ./.go-version
